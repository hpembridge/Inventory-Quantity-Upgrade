<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Majilite-Majilite-Baby Ostrich-Cobalt Blue</title>
    <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="shared/css/design-tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="inventory.css" />
    <link rel="stylesheet" href="components/breadcrumbs/breadcrumbs.css" />
    <link rel="stylesheet" href="components/toast/toast.css" />
    <link rel="stylesheet" href="components/switch/switch.css" />
    <script src="components/toast/toast.js"></script>
    <script src="inventory-data.js"></script>
    <script>
      window.SIDEBAR_CONFIG = {
        activeItem: 'Inventory',
        user: { name: 'Healey Pembridge', role: 'team member' }
      };
    </script>
  </head>
  <body>
    <script src="shared/components/sidebar-component.js"></script>

    <div class="main-content">
      <div class="breadcrumb-bar">
        <nav class="breadcrumbs">
          <a class="crumb" href="inventory.html"><i class="fa-regular fa-pallet-boxes"></i> Inventory</a>
          <i class="fa-regular fa-chevron-right crumb-sep"></i>
          <a class="crumb" href="inventory.html"><i class="fa-regular fa-layer-group"></i> Materials</a>
          <i class="fa-regular fa-chevron-right crumb-sep"></i>
          <a class="crumb" href="catalog.html"><i class="fa-regular fa-book"></i> Bookcloth</a>
          <i class="fa-regular fa-chevron-right crumb-sep"></i>
          <span class="crumb current">Majilite-Majilite-Baby Ostrich-Cobalt Blue</span>
        </nav>
      </div>

      <div class="page-scroll">
        <div class="page-inner">

          <!-- The back link shares its line with the page's one view
               control: whether used-up units are on screen. -->
          <div class="page-top">
            <a class="back-link" href="catalog.html">
              <i class="fa-regular fa-arrow-left"></i> Back to Bookcloth
            </a>

            <label class="switch">
              <input type="checkbox" id="showDepleted" />
              <span class="switch-track" aria-hidden="true"></span>
              <span>Show depleted</span>
            </label>
          </div>

          <!-- Item header: name, the edit action, and the item's properties -->
          <div class="page-card is-flush item-header">
            <div class="item-header-row">
              <h5>Majilite-Majilite-Baby Ostrich-Cobalt Blue</h5>
              <button class="icon-btn" type="button"
                      title="Edit item details" aria-label="Edit item details">
                <i class="fa-solid fa-pen"></i>
              </button>
            </div>

            <div class="item-header-row chip-row">
              <span class="chip"><i class="fa-regular fa-user chip-icon"></i><span class="chip-label">Vendor</span><span class="chip-value">Majilite</span></span>
              <span class="chip"><i class="fa-regular fa-sitemap chip-icon"></i><span class="chip-label">Product Line</span><span class="chip-value">Majilite</span></span>
              <span class="chip"><i class="fa-regular fa-layer-group chip-icon"></i><span class="chip-label">Family</span><span class="chip-value">Baby Ostrich</span></span>
              <span class="chip"><i class="fa-regular fa-palette chip-icon"></i><span class="chip-label">Color</span><span class="chip-value">Cobalt Blue</span></span>
              <span class="chip"><i class="fa-regular fa-toggle-on chip-icon"></i><span class="chip-label">House / Stocking</span><span class="chip-value">*</span></span>
            </div>
          </div>

          <!-- Item units: one tab per unit type, as on the items table -->
          <div class="section">
            <div class="tab-row" id="unitTabs"></div>
            <div id="unitBlocks"></div>
          </div>

        </div>
      </div>
    </div>

    <script>
      const INV = window.INVENTORY;
      const { MEASUREMENT_TYPES, fmt } = INV;

      const cfg   = INV.loadConfig();
      const units = INV.DEFAULT_UNITS;

      const ITEM = INV.ITEMS.find(i => i.detailed);

      /* ── Rollup ─────────────────────────────────────────────────
         A KPI row: four headline figures for this unit type, each in its
         own tile. The tiles are identical by default — colour is not
         decoration. It appears only on Available, and only to say the
         stock needs attention:
         amber when it is running low, red when the item is oversold.
         Neither state relies on colour alone; both carry an icon and a
         tooltip saying what the state is.
         --------------------------------------------------------- */
      const STATE_FLAG = {
        low:  { cls: 'is-low',  icon: 'fa-circle-exclamation',   note: 'Running low on available stock.' },
        over: { cls: 'is-over', icon: 'fa-triangle-exclamation', note: 'Allocated stock exceeds in-house stock.' }
      };

      function rollupFor(t) {
        const spec    = MEASUREMENT_TYPES[t.measurementType];
        const measure = INV.quantityUnitLabel(t);
        const q       = INV.itemQty(ITEM, t);
        const flag    = STATE_FLAG[INV.stockState(q)];

        const stat = (label, value, opts = {}) => `
          <div class="rollup-stat${opts.cls ? ' ' + opts.cls : ''}"${opts.note ? ` title="${opts.note}"` : ''}>
            <div class="rollup-label">
              ${opts.icon ? `<i class="fa-solid ${opts.icon}"></i> ` : ''}${label}
            </div>
            <div class="rollup-value">${fmt(value)}<span class="rollup-measure">${measure}</span></div>
          </div>`;

        return `
          <div class="unit-rollup">
            <div class="rollup-stats">
              ${stat('On Order', q.onOrder)}
              ${stat('In-House', q.inHouse)}
              ${stat('Allocated', q.allocated)}
              ${stat('Available', q.available, flag || {})}
            </div>
            <button class="add-row" type="button" data-add="${t.id}">
              <i class="fa-regular fa-plus" style="margin-right: var(--scale-200)"></i> Add ${spec.label}
            </button>
          </div>`;
      }

      /* ── Per-measurement-type table shapes ────────────────────
         Every column names the field behind it: `kind` decides what
         the input will accept, `field` which property it writes.
         ------------------------------------------------------- */
      function columnsFor(t) {
        const spec = MEASUREMENT_TYPES[t.measurementType];
        const base = [
          { key: 'location', label: 'Location', left: true, cls: 'col-loc', kind: 'text' },
          { key: 'job',      label: 'Job Number', left: true, cls: 'col-job', kind: 'job' }
        ];
        if (spec.key === 'roll') {
          return base.concat([
            { key: 'width',  label: `Width (${t.widthUnit})`, kind: 'measure' },
            { key: 'length', label: `Yardage (${t.lengthUnit})`, strong: true, kind: 'quantity' }
          ]);
        }
        if (spec.key === 'sheet') {
          /* Width and height take their own units, so name both unless
             they happen to match. */
          const size = t.widthUnit === t.heightUnit
            ? `Size (${t.widthUnit})`
            : `Size (${t.widthUnit} &times; ${t.heightUnit})`;
          return base.concat([
            { key: '_size', label: size, kind: 'size' },
            { key: 'count', label: 'Count', strong: true, kind: 'count' }
          ]);
        }
        return base.concat([{ key: 'count', label: 'Count', strong: true, kind: 'count' }]);
      }

      /* ── Field rules ──────────────────────────────────────────
         One place to say, per kind of value, what may be typed, what
         counts as valid, and what to say when it does not. Rejecting
         an entry keeps it on screen to be corrected and raises a
         toast, so the reason is never left to the field alone.
         ------------------------------------------------------- */
      /* Digits and a single decimal point, to two places. */
      function decimals(v) {
        const cleaned = v.replace(/[^\d.]/g, '');
        const [whole, ...rest] = cleaned.split('.');
        return rest.length
          ? `${whole.slice(0, 5)}.${rest.join('').slice(0, 2)}`
          : whole.slice(0, 5);
      }

      const FIELD_RULES = {
        text: {
          placeholder: 'Add location',
          filter: v => v.slice(0, 24),
          valid:  () => true,
          parse:  v => v.trim() || null
        },
        job: {
          placeholder: '000000',
          inputmode: 'numeric',
          maxlength: 6,
          cls: 'is-job',
          /* Empty releases the allocation; anything else must be a
             whole six-digit job number. */
          filter: v => v.replace(/\D/g, '').slice(0, 6),
          valid:  v => v === '' || INV.isValidJob(v),
          error:  'Job numbers are six digits — for example 487712.',
          parse:  v => v === '' ? null : v
        },
        /* A physical dimension: a roll 0 inches wide is not a roll. */
        measure: {
          placeholder: '0.00',
          inputmode: 'decimal',
          cls: 'is-num',
          filter: decimals,
          valid:  v => Number(v) > 0,
          error:  'Enter a measurement greater than zero.',
          parse:  v => Number(v)
        },
        /* A quantity on hand. Zero is not an error — it says the unit
           has been used up, which is what marks it depleted. */
        quantity: {
          placeholder: '0.00',
          inputmode: 'decimal',
          cls: 'is-num',
          filter: decimals,
          valid:  v => Number(v) >= 0,
          error:  'Enter a quantity of zero or more.',
          parse:  v => Number(v)
        },
        count: {
          placeholder: '0',
          inputmode: 'numeric',
          cls: 'is-num',
          filter: v => v.replace(/[^\d]/g, '').slice(0, 6),
          valid:  v => Number(v) >= 0,
          error:  'Enter a whole count of zero or more.',
          parse:  v => Number(v)
        }
      };

      /* ── Depletion ────────────────────────────────────────────
         The quantity column is the one that says how much is on hand:
         yardage for a roll, count for anything else. A unit whose
         quantity has reached zero is depleted — used up, not wrong. A
         quantity not yet entered (a row just added) is neither.
         ------------------------------------------------------- */
      function quantityKey(t) {
        return MEASUREMENT_TYPES[t.measurementType].key === 'roll' ? 'length' : 'count';
      }

      function isDepleted(u, t) {
        const v = u[quantityKey(t)];
        return v !== null && v !== undefined && v !== '' && Number(v) === 0;
      }

      /* Depleted units are out of the way unless asked for. */
      let showDepleted = false;

      /* How a settled value is written into a field. */
      function displayValue(kind, raw) {
        if (raw === null || raw === undefined || raw === '') return '';
        return (kind === 'measure' || kind === 'quantity') ? fmt(raw) : String(raw);
      }

      function fieldInput(u, key, kind, extraCls = '') {
        const r    = FIELD_RULES[kind];
        /* Measurements show their settled form — 1.50, not 1.5 — so a
           field at rest reads exactly as the old static cell did. */
        const val = displayValue(kind, u[key]);
        const attrs = [
          `class="cell-field${r.cls ? ' ' + r.cls : ''}${extraCls ? ' ' + extraCls : ''}"`,
          `value="${val}"`,
          `placeholder="${r.placeholder}"`,
          `data-uid="${u.id}"`,
          `data-field="${key}"`,
          `data-kind="${kind}"`,
          r.inputmode ? `inputmode="${r.inputmode}"` : '',
          r.maxlength ? `maxlength="${r.maxlength}"` : '',
          `aria-label="${FIELD_LABELS[key] || key}"`
        ].filter(Boolean).join(' ');
        return `<input type="text" ${attrs} />`;
      }

      const FIELD_LABELS = {
        location: 'Location',
        job:      'Job number, six digits',
        width:    'Width',
        height:   'Height',
        length:   'Yardage',
        count:    'Count'
      };

      /* Which unit type is on screen. */
      let activeId = cfg.unitTypes[0]?.id || null;
      function activeType() { return INV.unitTypeById(cfg, activeId); }

      function cellValue(u, col) {
        if (col.key === '_size') {
          return `<span class="size-field">
                    ${fieldInput(u, 'width', 'measure')}
                    <span class="size-x" aria-hidden="true">&times;</span>
                    ${fieldInput(u, 'height', 'measure')}
                  </span>`;
        }
        return fieldInput(u, col.key, col.kind);
      }

      /* The footer says what is on screen and what is being kept off
         it, and is cheap enough to rebuild on its own after an edit. */
      function footHtml(t) {
        const mine   = units.filter(u => u.unitTypeId === t.id);
        const spent  = mine.filter(u => isDepleted(u, t));
        const shown  = showDepleted ? mine.length : mine.length - spent.length;
        const hidden = showDepleted ? 0 : spent.length;
        return `
          <span class="unit-type-count">${shown} ${shown === 1 ? 'unit' : 'units'}</span>
          ${hidden ? `<span class="unit-type-hidden">${hidden} depleted hidden</span>` : ''}`;
      }

      /* ── Tabs ───────────────────────────────────────────────── */
      function renderTabs() {
        document.getElementById('unitTabs').innerHTML = cfg.unitTypes.map(t =>
          `<button class="tab-btn${t.id === activeId ? ' active' : ''}" type="button" data-tab="${t.id}">${t.name}</button>`
        ).join('');
      }

      /* ── Active unit type ───────────────────────────────────────
         The tab already names the type, so the card header carries only
         the stock form, the rollup and the add action.
         --------------------------------------------------------- */
      function renderBlocks() {
        const t = activeType();
        const host = document.getElementById('unitBlocks');
        if (!t) { host.innerHTML = ''; return; }

        {
          const cols    = columnsFor(t);
          const mine    = units.filter(u => u.unitTypeId === t.id);
          const spent   = mine.filter(u => isDepleted(u, t));
          const shown   = showDepleted ? mine : mine.filter(u => !isDepleted(u, t));

          const row = (u) => `
            <tr${isDepleted(u, t) ? ' class="is-depleted"' : ''} data-row="${u.id}">
              ${cols.map(c => `<td class="${c.left ? 'left' : 'qty'}${c.strong ? ' strong' : ''}${c.cls ? ' ' + c.cls : ''}">${cellValue(u, c)}</td>`).join('')}
              <td class="qty col-act">
                <div class="unit-actions">
                  <button class="icon-btn" type="button" title="Print unit label"><i class="fa-regular fa-print"></i></button>
                </div>
              </td>
            </tr>`;

          /* Two different kinds of empty: nothing here at all, or
             nothing left that is not used up. They need different
             sentences. */
          const empty = mine.length
            ? `Every ${t.name.toLowerCase().replace(/s$/, '')} here is depleted. Turn on Show depleted to see ${spent.length === 1 ? 'it' : 'them'}.`
            : `No ${t.name.toLowerCase()} yet. Add one to start tracking stock.`;

          const body = shown.length
            ? shown.map(row).join('')
            : `<tr><td class="left" colspan="${cols.length + 1}" style="color:var(--text-tertiary)">${empty}</td></tr>`;

          host.innerHTML = `
            <div class="unit-type-block">
              ${rollupFor(t)}
              <table class="data">
                <thead>
                  <tr>
                    ${cols.map(c => `<th class="${c.left ? 'left' : ''}${c.cls ? ' ' + c.cls : ''}">${c.label}</th>`).join('')}
                    <th class="col-act"></th>
                  </tr>
                </thead>
                <tbody>${body}</tbody>
              </table>
              <div class="unit-type-foot">${footHtml(t)}</div>
            </div>`;
        }
      }

      /* ── Tab switching ────────────────────────────────────── */
      document.getElementById('unitTabs').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-tab]');
        if (!btn || btn.dataset.tab === activeId) return;
        activeId = btn.dataset.tab;
        renderTabs();
        renderBlocks();
      });

      /* ── Editing ──────────────────────────────────────────────
         Fields commit on blur or Enter and revert on Escape; there
         are no save buttons, so the only thing to learn is that
         leaving the field keeps the value. A commit that changes a
         figure re-renders the block, so the rollup above the table
         can never disagree with the rows beneath it.
         ------------------------------------------------------- */
      const blocksEl = document.getElementById('unitBlocks');

      function unitById(id) { return units.find(u => u.id === id); }

      /* A committed value changes the figures above the table and the
         count below it, but re-rendering the rows would throw away the
         focus — and with it the ability to tab through a row one field
         at a time. Neither the rollup nor the footer holds a field, so
         both can be rebuilt on the spot while the table stands. */
      function refreshFigures() {
        const t      = activeType();
        const rollup = blocksEl.querySelector('.unit-rollup');
        const foot   = blocksEl.querySelector('.unit-type-foot');
        if (rollup) rollup.outerHTML = rollupFor(t);
        if (foot)   foot.innerHTML   = footHtml(t);
      }

      /* Typing is constrained as it happens — the field simply will
         not hold a character it cannot accept. */
      blocksEl.addEventListener('input', (e) => {
        const el = e.target;
        if (!el.matches('.cell-field')) return;
        const filtered = FIELD_RULES[el.dataset.kind].filter(el.value);
        if (filtered !== el.value) {
          const at = el.selectionStart - (el.value.length - filtered.length);
          el.value = filtered;
          el.setSelectionRange(at, at);
        }
        el.classList.remove('invalid');
      });

      function commit(el) {
        const rule = FIELD_RULES[el.dataset.kind];
        const unit = unitById(el.dataset.uid);
        const key  = el.dataset.field;
        const raw  = el.value.trim();
        const was  = unit[key];

        /* Clearing a number is not an entry, so it needs no telling
           off — the field simply returns to what it held. (An emptied
           job number is a real instruction: release the allocation.)
           */
        if (raw === '' && el.dataset.kind !== 'job' && el.dataset.kind !== 'text') {
          el.value = displayValue(el.dataset.kind, was);
          return true;
        }

        /* An invalid entry is rejected outright: the field goes back to
           the value it held, the toast says why, and the error tint
           flashes just long enough to point at which field refused. */
        if (!rule.valid(raw)) {
          el.value = displayValue(el.dataset.kind, was);
          el.classList.add('invalid');
          clearTimeout(el._flash);
          el._flash = setTimeout(() => el.classList.remove('invalid'), 900);
          window.toast(rule.error, 'error');
          return false;
        }

        const next = rule.parse(raw);
        el.classList.remove('invalid');
        el.value = displayValue(el.dataset.kind, next);
        if (String(next ?? '') === String(was ?? '')) return true;

        unit[key] = next;

        /* A depleted unit dims where it stands. It is only taken off
           screen once the cursor has left the row, so a zero entered
           by mistake can still be corrected without the row vanishing
           mid-edit. */
        const tr = el.closest('tr[data-row]');
        if (tr) tr.classList.toggle('is-depleted', isDepleted(unit, activeType()));

        refreshFigures();
        return true;
      }

      /* One click puts the whole value in hand: focusing a field selects
         its contents, so typing replaces rather than appends. The mouse
         would otherwise drop a caret at the click point on release, so
         that first selection is held through mouseup — a second click,
         or a drag, still positions the caret normally. */
      let claiming = null;

      blocksEl.addEventListener('mousedown', (e) => {
        const el = e.target.closest('.cell-field');
        if (el && el !== document.activeElement) claiming = el;
      });

      blocksEl.addEventListener('focusin', (e) => {
        if (e.target.matches('.cell-field')) e.target.select();
      });

      blocksEl.addEventListener('mouseup', (e) => {
        if (!claiming || e.target !== claiming) { claiming = null; return; }
        const el = claiming;
        claiming = null;
        /* A drag is a deliberate selection — leave it alone. */
        if (el.selectionStart !== el.selectionEnd) return;
        e.preventDefault();
        el.select();
      });

      blocksEl.addEventListener('focusout', (e) => {
        if (!e.target.matches('.cell-field')) return;
        commit(e.target);

        const tr = e.target.closest('tr[data-row]');
        /* Wait a tick: focus may only be moving to the next field in
           the same row. */
        setTimeout(() => {
          if (!tr || !tr.isConnected || tr.contains(document.activeElement)) return;
          if (showDepleted || !tr.classList.contains('is-depleted')) return;

          const t = activeType();
          window.toast('Unit depleted — hidden. Turn on Show depleted to see it.', 'info');
          /* Losing the last visible row means the table needs its
             empty state, which only a full render can give it. */
          if (blocksEl.querySelectorAll('tbody tr[data-row]').length === 1) {
            renderBlocks();
          } else {
            tr.remove();
            blocksEl.querySelector('.unit-type-foot').innerHTML = footHtml(t);
          }
        }, 0);
      });

      blocksEl.addEventListener('keydown', (e) => {
        const el = e.target;
        if (!el.matches('.cell-field')) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          commit(el);
          el.blur();
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          el.value = displayValue(el.dataset.kind, unitById(el.dataset.uid)[el.dataset.field]);
          el.classList.remove('invalid');
          el.blur();
        }
      });

      /* ── Show depleted ────────────────────────────────────────
         Off by default: a depleted unit is history, not stock. The
         toggle is the way back to it — including to recount one that
         was zeroed by mistake.
         ------------------------------------------------------- */
      document.getElementById('showDepleted').addEventListener('change', (e) => {
        showDepleted = e.target.checked;
        renderBlocks();
      });

      /* ── Adding a unit ────────────────────────────────────────
         Add puts an empty row at the bottom of the table and puts the
         cursor in its first field, so a new unit is entered in the
         same place and the same way as an existing one is corrected.
         ------------------------------------------------------- */
      let nextId = units.length + 1;

      blocksEl.addEventListener('click', (e) => {
        const add = e.target.closest('[data-add]');
        if (!add) return;

        const t   = INV.unitTypeById(cfg, add.dataset.add);
        const def = t.defaults || {};
        const u   = { id: `u-new-${nextId++}`, unitTypeId: t.id, job: null };

        /* The unit type's default measurements are the starting point —
           most rolls of a cloth are the same width, so adding one is a
           confirmation, not a transcription. Location is generated on
           creation, and a field with no default starts empty. */
        const fill = (key) => { u[key] = def[key] ?? null; };
        u.location = null;
        columnsFor(t).forEach(c => {
          if (c.key === '_size') { fill('width'); fill('height'); }
          else if (c.kind !== 'text' && c.kind !== 'job') fill(c.key);
        });
        units.push(u);
        renderBlocks();

        const first = blocksEl.querySelector(`[data-row="${u.id}"] .cell-field`);
        if (first) first.focus();
      });

      renderTabs();
      renderBlocks();
    </script>
  </body>
</html>
