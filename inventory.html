<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory — Materials</title>
    <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="shared/css/design-tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="inventory.css" />
    <link rel="stylesheet" href="components/breadcrumbs/breadcrumbs.css" />
    <link rel="stylesheet" href="components/confirm-modal/confirm-modal.css" />
    <link rel="stylesheet" href="components/flyout/flyout.css" />
    <link rel="stylesheet" href="components/switch/switch.css" />
    <link rel="stylesheet" href="components/toast/toast.css" />
    <script src="components/toast/toast.js"></script>
    <script>
      window.SIDEBAR_CONFIG = {
        activeItem: 'Inventory',
        user: { name: 'Healey Pembridge', role: 'team member' }
      };
    </script>
  </head>
  <body>
    <script src="shared/components/sidebar-component.js"></script>
    <script src="inventory-data.js"></script>

    <div class="main-content">
      <div class="breadcrumb-bar">
        <nav class="breadcrumbs">
          <span class="crumb current"><i class="fa-regular fa-pallet-boxes"></i> Inventory</span>
        </nav>
      </div>

      <div class="page-scroll">
        <div class="page-inner">

            <!-- Library tabs — one per library this person keeps in their
                 view, each dismissable, plus a picker to add another. -->
            <div class="lib-tabs" id="libTabs"></div>

            <!-- The active library's panel welds onto its tab, so the two
                 read as one folder. -->
            <div class="lib-panel">
              <div class="title-row" id="libTitle"></div>

              <div class="catalog-list" id="libCatalogs"></div>
            </div>

          </div>
      </div>
    </div>

    <!-- ── Library settings flyout ──
         Same .flyout-overlay/.flyout-panel recipe as the catalog's Edit
         Unit Type panel. Edits a draft copy, so Cancel (or the overlay
         / Esc) discards cleanly. -->
    <div class="flyout-overlay" id="libFlyout">
      <div class="flyout-panel" role="dialog" aria-modal="true" aria-labelledby="libFlyoutTitle">
        <div class="flyout-header">
          <span class="flyout-title" id="libFlyoutTitle">Library Settings</span>
          <button class="icon-btn" type="button" id="libFlyoutClose" aria-label="Close">
            <i class="fa-regular fa-xmark"></i>
          </button>
        </div>
        <div class="flyout-body" id="libFlyoutBody"></div>
        <div class="flyout-footer">
          <div class="footer-actions">
            <button class="btn-pill outline sm" type="button" id="libFlyoutCancel">Cancel</button>
            <button class="btn-pill solid sm" type="button" id="libFlyoutDone">Save Library</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Deleting a library is the one destructive action here, so it is
         confirmed and the confirmation says what is lost. -->
    <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true"
         aria-labelledby="confirmTitle">
      <div class="modal-panel">
        <div class="modal-header">
          <span class="modal-title" id="confirmTitle">Delete library?</span>
          <button class="icon-btn" type="button" id="confirmClose" aria-label="Close">
            <i class="fa-regular fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <p class="confirm-warning" id="confirmBody"></p>
        </div>
        <div class="modal-footer">
          <button class="btn-pill outline" type="button" id="confirmCancel">Cancel</button>
          <button class="btn-pill solid is-danger" type="button" id="confirmDelete">Delete Library</button>
        </div>
      </div>
    </div>

    <script>
      const INV = window.INVENTORY;

      /* The libraries in this person's view, and which one is showing. */
      let openIds  = INV.loadLibraryView().slice();
      let activeId = openIds[0];
      let query = '';

      const tabsEl  = document.getElementById('libTabs');
      const titleEl = document.getElementById('libTitle');
      const cardsEl = document.getElementById('libCatalogs');

      const esc = (t) => String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

      function commitView() { INV.saveLibraryView(openIds.slice()); }

      /* ── Tabs ───────────────────────────────────────────────────
         The X hides a library from this view only, so it is labelled
         that way rather than "close" or "remove". A person always keeps
         at least one library, so the last X explains why it is off.
         --------------------------------------------------------- */
      function renderTabs() {
        const last = openIds.length === 1;

        tabsEl.innerHTML = openIds.map(id => {
          const lib = INV.libraryById(id);
          const on  = id === activeId;
          return `
            <button class="lib-tab${on ? ' active' : ''}" type="button" data-lib="${id}">
              <span>${esc(lib.name)}</span>
              <span class="tab-close" data-hide="${id}" role="button" tabindex="0"
                    ${last ? 'aria-disabled="true" title="Keep at least one library in your view"'
                           : `title="Hide ${esc(lib.name)} from your view" aria-label="Hide ${esc(lib.name)} from your view"`}>
                <i class="fa-regular fa-xmark"></i>
              </span>
            </button>`;
        }).join('') + `
          <div class="tab-add-wrap">
            <button class="lib-tab add" type="button" id="pickerBtn"
                    aria-expanded="false" aria-haspopup="true"
                    title="Add a library to your view" aria-label="Add a library to your view">
              <i class="fa-regular fa-plus"></i>
            </button>
            <div class="lib-picker" id="picker" hidden>
              <input class="input lib-picker-input" id="pickerInput" type="search"
                     placeholder="Find a library" autocomplete="off" />
              <div class="lib-picker-body" id="pickerBody"></div>
            </div>
          </div>`;
      }

      /* ── Picker ─────────────────────────────────────────────────
         Lists every library, marking the ones already in this view, so
         nobody has to remember what they have open. Creating a library
         is offered only when nothing matches, and stays a secondary
         action — it is a much bigger step than adding a tab.
         --------------------------------------------------------- */
      function renderPicker() {
        const q = query.trim().toLowerCase();
        const hits = INV.LIBRARIES.filter(l => !q || l.name.toLowerCase().includes(q));
        const body = document.getElementById('pickerBody');
        if (!body) return;

        if (!hits.length) {
          body.innerHTML = `
            <p class="lib-picker-none">No library called &ldquo;${esc(query.trim())}&rdquo;.</p>
            <button class="btn-pill outline sm" type="button" id="pickerCreate">
              <i class="fa-regular fa-plus"></i> Create ${esc(query.trim())}
            </button>`;
          return;
        }

        body.innerHTML = `<ul class="lib-picker-list">${hits.map(l => {
          const open = openIds.includes(l.id);
          const n = l.catalogs.length;
          return `
            <li>
              <button class="lib-option" type="button" data-add="${l.id}">
                <span class="lib-option-name">${esc(l.name)}</span>
                <span class="lib-option-meta">${n} catalog${n === 1 ? '' : 's'}</span>
                ${open ? '<span class="lib-option-on"><i class="fa-solid fa-check"></i> In your view</span>' : ''}
              </button>
            </li>`;
        }).join('')}</ul>`;
      }

      function openPicker() {
        query = '';
        document.getElementById('picker').hidden = false;
        document.getElementById('pickerBtn').setAttribute('aria-expanded', 'true');
        const input = document.getElementById('pickerInput');
        input.value = '';
        renderPicker();
        input.focus();
      }
      function closePicker() {
        const el = document.getElementById('picker');
        if (el) el.hidden = true;
        const btn = document.getElementById('pickerBtn');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
      const pickerOpen = () => {
        const el = document.getElementById('picker');
        return el && !el.hidden;
      };

      /* ── Title row ──────────────────────────────────────────────
         Renaming happens in place, the same swap the item page uses for
         a job number: the value becomes a field with save and cancel
         beside it. Deleting is the one destructive action, so it asks.
         --------------------------------------------------------- */
      function renderTitle(lib) {
        const onlyOne = INV.LIBRARIES.length === 1;

        titleEl.innerHTML = `
          <h5>${esc(lib.name)}</h5>
          <span class="lib-name-actions">
            <button class="icon-btn" type="button" data-lib-settings
                    title="${esc(lib.name)} settings" aria-label="${esc(lib.name)} settings">
              <i class="fa-regular fa-pen"></i>
            </button>
            <button class="icon-btn danger" type="button" data-delete-lib
                    ${onlyOne ? 'disabled title="A catalog needs at least one library"'
                              : `title="Delete ${esc(lib.name)}" aria-label="Delete ${esc(lib.name)}"`}>
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </span>`;
      }

      /* ── Library content ───────────────────────────────────────── */
      function renderLibrary() {
        const lib = INV.libraryById(activeId);
        if (!lib) { titleEl.innerHTML = ''; cardsEl.innerHTML = ''; return; }

        renderTitle(lib);
        cardsEl.innerHTML = `
          <button class="add-row" type="button">
            <span class="add-label"><i class="fa-regular fa-plus"></i> Add Catalog</span>
          </button>` + lib.catalogs.map(c => `
          <a class="catalog-row" href="catalog.html">
            <span class="catalog-row-title">${esc(c.name)}</span>
            <span class="catalog-row-end">
              <span class="count-pill">${c.items} Items</span>
              <span class="icon-btn" role="button" tabindex="0" data-catalog-settings
                    title="Edit ${esc(c.name)}" aria-label="Edit ${esc(c.name)}">
                <i class="fa-regular fa-pen"></i>
              </span>
            </span>
          </a>`).join('');
      }

      function render() { renderTabs(); renderLibrary(); }

      /* The row itself opens the catalog; the pencil goes to its settings.
         The pencil is a span so it can sit inside the row's link. */
      cardsEl.addEventListener('click', (e) => {
        const edit = e.target.closest('[data-catalog-settings]');
        if (!edit) return;
        e.preventDefault();
        location.href = 'catalog-settings.html';
      });
      cardsEl.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' && e.key !== ' ') return;
        const edit = e.target.closest('[data-catalog-settings]');
        if (!edit) return;
        e.preventDefault();
        location.href = 'catalog-settings.html';
      });

      titleEl.addEventListener('click', (e) => {
        if (e.target.closest('[data-lib-settings]')) { openLibFlyout(); return; }
        const del = e.target.closest('[data-delete-lib]');
        if (del && !del.disabled) askDelete();
      });

      /* ── Library settings ──────────────────────────────────────
         The library's name, and which forms stock can take inside it.
         The forms are what a catalog's unit types may be built from, so
         turning one off here takes it out of every Stock Form list in
         the library — which is why the panel says so, and why the last
         one on cannot be turned off.
         --------------------------------------------------------- */
      const libFlyout     = document.getElementById('libFlyout');
      const libFlyoutBody = document.getElementById('libFlyoutBody');

      let libDraft = null;

      function renderLibFlyout() {
        const forms = Object.values(INV.MEASUREMENT_TYPES);
        const on    = libDraft.stockForms;
        const last  = on.length === 1;

        libFlyoutBody.innerHTML = `
          <div class="field">
            <label class="field-label">Library name</label>
            <input class="input" type="text" data-lib-field="name"
                   value="${esc(libDraft.name)}" autocomplete="off" />
          </div>

          <div class="field-group">
            <div class="field-group-title">Stock forms</div>
            <div class="field-group-help">
              The physical forms stock takes in this library. Catalog unit types
              can only use forms listed here.
            </div>
            ${forms.map(m => {
              const checked = on.includes(m.key);
              const stuck   = checked && last;
              return `
                <label class="switch"${stuck ? ' title="A library needs at least one stock form"' : ''}>
                  <input type="checkbox" data-form="${m.key}"
                         ${checked ? 'checked' : ''} ${stuck ? 'disabled' : ''} />
                  <span class="switch-track" aria-hidden="true"></span>
                  <span><i class="fa-regular ${INV.measurementIcon(m.key)}"></i> ${m.label}</span>
                </label>`;
            }).join('')}
          </div>`;
      }

      function openLibFlyout() {
        const lib = INV.libraryById(activeId);
        libDraft = { name: lib.name, stockForms: INV.stockFormsOf(lib).slice() };
        document.getElementById('libFlyoutTitle').textContent = `${lib.name} Settings`;
        renderLibFlyout();
        libFlyout.classList.add('open');
        libFlyoutBody.querySelector('[data-lib-field="name"]').focus();
      }

      function closeLibFlyout() {
        libFlyout.classList.remove('open');
        libDraft = null;
      }

      libFlyoutBody.addEventListener('input', (e) => {
        if (!libDraft) return;
        if (e.target.dataset.libField === 'name') {
          libDraft.name = e.target.value;
          e.target.classList.remove('invalid');
        }
      });

      libFlyoutBody.addEventListener('change', (e) => {
        const form = e.target.dataset.form;
        if (!libDraft || !form) return;
        libDraft.stockForms = e.target.checked
          ? libDraft.stockForms.concat(form)
          : libDraft.stockForms.filter(k => k !== form);
        renderLibFlyout();   /* the last one on becomes unturnable-off */
      });

      document.getElementById('libFlyoutDone').addEventListener('click', () => {
        if (!libDraft) return;
        const name = libDraft.name.trim();
        /* A library with no name would be unfindable in the picker. */
        if (!name) {
          const el = libFlyoutBody.querySelector('[data-lib-field="name"]');
          el.classList.add('invalid');
          el.focus();
          window.toast('Give the library a name.', 'error');
          return;
        }
        const lib = INV.libraryById(activeId);
        lib.name = name;
        lib.stockForms = libDraft.stockForms.slice();
        INV.saveLibraries();
        closeLibFlyout();
        render();
      });

      document.getElementById('libFlyoutCancel').addEventListener('click', closeLibFlyout);
      document.getElementById('libFlyoutClose').addEventListener('click', closeLibFlyout);
      libFlyout.addEventListener('click', (e) => { if (e.target === libFlyout) closeLibFlyout(); });

      /* ── Delete, with the cost stated ───────────────────────────── */
      const modal = document.getElementById('confirmModal');

      function askDelete() {
        const lib = INV.libraryById(activeId);
        const n = lib.catalogs.length;
        document.getElementById('confirmTitle').textContent = `Delete ${lib.name}?`;
        document.getElementById('confirmBody').textContent =
          `This deletes the library and its ${n} catalog${n === 1 ? '' : 's'} for everyone. ` +
          `To take it off your own tabs instead, close it with the × on its tab.`;
        modal.classList.add('open');
        document.getElementById('confirmCancel').focus();
      }
      function closeModal() { modal.classList.remove('open'); }

      function deleteLibrary() {
        const id = activeId;
        const index = openIds.indexOf(id);
        INV.LIBRARIES.splice(INV.LIBRARIES.findIndex(l => l.id === id), 1);
        openIds = openIds.filter(x => x !== id);
        /* Never leave the page with no library showing. */
        if (!openIds.length && INV.LIBRARIES.length) openIds = [INV.LIBRARIES[0].id];
        commitView();
        INV.saveLibraries();
        activeId = openIds[Math.min(Math.max(index, 0), openIds.length - 1)];
        closeModal();
        render();
      }

      document.getElementById('confirmDelete').addEventListener('click', deleteLibrary);
      document.getElementById('confirmCancel').addEventListener('click', closeModal);
      document.getElementById('confirmClose').addEventListener('click', closeModal);
      modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

      /* ── Actions ───────────────────────────────────────────────── */
      function addLibrary(id) {
        if (!openIds.includes(id)) { openIds.push(id); commitView(); }
        activeId = id;
        closePicker();
        render();
      }

      /* Nothing is lost here — the picker lists every library, so a
         hidden one is one click from coming back. */
      function hideLibrary(id) {
        if (openIds.length === 1) return;
        const index = openIds.indexOf(id);
        openIds.splice(index, 1);
        commitView();
        if (activeId === id) activeId = openIds[Math.min(index, openIds.length - 1)];
        render();
      }

      tabsEl.addEventListener('click', (e) => {
        const hide = e.target.closest('[data-hide]');
        if (hide) {
          e.stopPropagation();
          if (hide.getAttribute('aria-disabled') !== 'true') hideLibrary(hide.dataset.hide);
          return;
        }
        if (e.target.closest('#pickerBtn')) {
          pickerOpen() ? closePicker() : openPicker();
          return;
        }
        const add = e.target.closest('[data-add]');
        if (add) { addLibrary(add.dataset.add); return; }
        if (e.target.closest('#pickerCreate')) {
          /* Prototype: a real create would name the library and set who
             it belongs to before it appears as a tab. */
          closePicker();
          return;
        }
        const tab = e.target.closest('[data-lib]');
        if (tab && tab.dataset.lib !== activeId) {
          activeId = tab.dataset.lib;
          render();
        }
      });

      /* ── Picker keyboard nav ────────────────────────────────────
         Down from the field moves into the list and down again walks
         it; up walks back and returns to the field from the top, so
         typing is always one key away. Enter or Tab takes the option
         that has focus — Tab is intercepted only while an option is
         focused, so it still leaves the picker from the field.
         --------------------------------------------------------- */
      const options = () => [...tabsEl.querySelectorAll('.lib-option')];

      function focusOption(i) {
        const list = options();
        if (!list.length) return;
        list[Math.max(0, Math.min(i, list.length - 1))].focus();
      }

      tabsEl.addEventListener('keydown', (e) => {
        const hide = e.target.closest('[data-hide]');
        if (hide && (e.key === 'Enter' || e.key === ' ')) {
          e.preventDefault(); e.stopPropagation();
          if (hide.getAttribute('aria-disabled') !== 'true') hideLibrary(hide.dataset.hide);
          return;
        }

        if (e.target.id === 'pickerInput') {
          if (e.key === 'ArrowDown') { e.preventDefault(); focusOption(0); }
          return;
        }

        const opt = e.target.closest('.lib-option');
        if (!opt) return;
        const list = options();
        const i = list.indexOf(opt);

        if (e.key === 'ArrowDown') { e.preventDefault(); focusOption(i + 1); }
        else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (i === 0) document.getElementById('pickerInput')?.focus();
          else focusOption(i - 1);
        }
        else if (e.key === 'Tab') { e.preventDefault(); addLibrary(opt.dataset.add); }
        else if (e.key === 'Escape') {
          e.preventDefault();
          closePicker();
          document.getElementById('pickerBtn')?.focus();
        }
      });

      tabsEl.addEventListener('input', (e) => {
        if (e.target.id !== 'pickerInput') return;
        query = e.target.value;
        renderPicker();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (libFlyout.classList.contains('open')) { closeLibFlyout(); return; }
        if (modal.classList.contains('open')) { closeModal(); return; }
        closePicker();
      });
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.tab-add-wrap')) closePicker();
      });

      render();
    </script>
  </body>
</html>
