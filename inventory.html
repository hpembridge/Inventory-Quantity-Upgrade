<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventory — Materials</title>
    <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="shared/css/design-tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="inventory.css" />
    <link rel="stylesheet" href="components/breadcrumbs/breadcrumbs.css" />
    <link rel="stylesheet" href="components/flyout/flyout.css" />
    <link rel="stylesheet" href="components/confirm-modal/confirm-modal.css" />
    <link rel="stylesheet" href="components/toast/toast.css" />
    <script src="components/toast/toast.js"></script>
    <script src="inventory-data.js"></script>
    <script>
      window.SIDEBAR_CONFIG = {
        activeItem: 'Inventory',
        user: { name: 'Healey Pembridge', role: 'team member' }
      };
    </script>
  </head>
  <body>
    <script src="shared/components/sidebar-component.js"></script>

    <div class="main-content">

      <div class="breadcrumb-bar">
        <nav class="breadcrumbs">
          <span class="crumb current"><i class="fa-regular fa-pallet-boxes"></i> Inventory</span>
        </nav>
      </div>

      <div class="page-scroll">
        <div class="page-inner">

          <!-- ══ Library tabs ═════════════════════════════════════
               One per library this person keeps in their view, each
               dismissable, plus the + that opens Add a Library.
               ───────────────────────────────────────────────────── -->
          <div class="lib-tabs" id="libTabs">
            <!-- tabs inserted before this button -->
            <button class="lib-tab add" type="button" id="pickerBtn"
                    title="Add a library to your view" aria-label="Add a library to your view">
              <i class="fa-regular fa-plus"></i>
            </button>
          </div>

          <!-- ══ Library panel ════════════════════════════════════
               Welds onto the active tab, so the two read as one folder.
               ───────────────────────────────────────────────────── -->
          <div class="lib-panel">

            <div class="title-row">
              <h5 id="libName"></h5>
              <span class="lib-name-actions">
                <button class="icon-btn" type="button" id="libSettings"
                        title="Library settings" aria-label="Library settings">
                  <i class="fa-regular fa-pen"></i>
                </button>
                <button class="icon-btn danger" type="button" id="libDelete"
                        title="Delete library" aria-label="Delete library">
                  <i class="fa-regular fa-trash-can"></i>
                </button>
              </span>
            </div>

            <div class="catalog-list">
              <button class="add-row" type="button">
                <span class="add-label"><i class="fa-regular fa-plus"></i> Add Catalog</span>
              </button>
              <div id="libCatalogs"></div>
            </div>

          </div>
          <!-- ══ end Library panel ════════════════════════════════ -->

        </div>
      </div>
    </div>

    <!-- ══ Library Settings ═════════════════════════════════════════
         Edits a draft copy, so Cancel, the overlay and Esc discard
         cleanly. The name is the only setting a library carries.
         ───────────────────────────────────────────────────────────── -->
    <div class="flyout-overlay" id="libFlyout">
      <div class="flyout-panel" role="dialog" aria-modal="true" aria-labelledby="libFlyoutTitle">

        <div class="flyout-header">
          <span class="flyout-title" id="libFlyoutTitle">Library Settings</span>
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <i class="fa-regular fa-xmark"></i>
          </button>
        </div>

        <div class="flyout-body">
          <div class="field">
            <label class="field-label">Library name</label>
            <input class="input" type="text" id="libNameInput" autocomplete="off" />
            <div class="field-help">
              What this library is called everywhere it appears — the tab, the picker,
              and the breadcrumb above every catalog inside it.
            </div>
          </div>
        </div>

        <div class="flyout-footer">
          <div class="footer-actions">
            <button class="btn-pill outline sm" type="button" data-close>Cancel</button>
            <button class="btn-pill solid sm" type="button" id="libFlyoutDone">Save Library</button>
          </div>
        </div>

      </div>
    </div>
    <!-- ══ end Library Settings ═════════════════════════════════════ -->

    <!-- ══ Add a Library ════════════════════════════════════════════
         An aside, not a popover: adding is a browse, every library in
         the company is listed, and several may be added in a row. The
         panel stays open while they are.
         ───────────────────────────────────────────────────────────── -->
    <div class="flyout-overlay" id="addLibFlyout">
      <div class="flyout-panel" role="dialog" aria-modal="true" aria-labelledby="addLibTitle">

        <div class="flyout-header">
          <span class="flyout-title" id="addLibTitle">Add a Library</span>
          <button class="icon-btn" type="button" data-close aria-label="Close">
            <i class="fa-regular fa-xmark"></i>
          </button>
        </div>

        <div class="flyout-body">
          <input class="input" id="pickerInput" type="search"
                 placeholder="Find a library" autocomplete="off" aria-label="Find a library" />

          <ul class="lib-picker-list" id="pickerList"></ul>

          <div id="pickerNone" hidden>
            <p class="lib-picker-none">No library called &ldquo;<span id="pickerQuery"></span>&rdquo;.</p>
            <button class="btn-pill outline sm" type="button" id="pickerCreate">
              <i class="fa-regular fa-plus"></i> Create it
            </button>
          </div>
        </div>

      </div>
    </div>
    <!-- ══ end Add a Library ════════════════════════════════════════ -->

    <!-- ══ Delete confirmation ══════════════════════════════════════
         The one destructive action on this page, so it asks, and the
         confirmation says what is lost.
         ───────────────────────────────────────────────────────────── -->
    <div class="modal-overlay" id="confirmModal" role="dialog" aria-modal="true"
         aria-labelledby="confirmTitle">
      <div class="modal-panel">
        <div class="modal-header">
          <span class="modal-title" id="confirmTitle">Delete library?</span>
          <button class="icon-btn" type="button" data-close-modal aria-label="Close">
            <i class="fa-regular fa-xmark"></i>
          </button>
        </div>
        <div class="modal-body">
          <p class="confirm-warning" id="confirmBody"></p>
        </div>
        <div class="modal-footer">
          <button class="btn-pill outline" type="button" data-close-modal>Cancel</button>
          <button class="btn-pill solid is-danger" type="button" id="confirmDelete">Delete Library</button>
        </div>
      </div>
    </div>
    <!-- ══ end Delete confirmation ══════════════════════════════════ -->

    <!-- ══ Inventory templates ══════════════════════════════════════ -->
    <template id="libTabTemplate">
      <button class="lib-tab" type="button" data-lib>
        <span data-tab-name></span>
        <span class="tab-close" role="button" tabindex="0" data-hide>
          <i class="fa-regular fa-xmark"></i>
        </span>
      </button>
    </template>

    <template id="catalogRowTemplate">
      <a class="catalog-row" data-catalog>
        <span class="catalog-row-title" data-catalog-name></span>
        <span class="catalog-row-end">
          <span class="count-pill" data-catalog-count></span>
          <span class="icon-btn" data-catalog-settings
                title="Catalog settings" aria-label="Catalog settings">
            <i class="fa-regular fa-pen"></i>
          </span>
        </span>
      </a>
    </template>

    <template id="libOptionTemplate">
      <li>
        <button class="lib-option" type="button" data-toggle>
          <span class="lib-option-name" data-option-name></span>
          <span class="lib-option-meta" data-option-meta></span>
          <span class="lib-option-on" data-option-on hidden>
            <span class="lib-option-rest"><i class="fa-solid fa-check"></i> In your view</span>
            <span class="lib-option-act"><i class="fa-solid fa-xmark"></i> Remove</span>
          </span>
        </button>
      </li>
    </template>

    <script>
      /* ============================================================
         Inventory — libraries and their catalogs
         ------------------------------------------------------------
         A library is a collection of catalogs, and exists for the whole
         company. What differs per person is which ones they keep as
         tabs, which is why hiding one changes only this view.

         Prototype-only: the mock data, and Add Catalog / Create Library
         which are affordances without behaviour.
         Would become Angular: the tab and catalog row as @for blocks,
         the three overlays as components, and the view list as user
         state on the server.
         ============================================================ */
      const INV = window.INVENTORY;

      let openIds  = INV.loadLibraryView().slice();
      let activeId = openIds[0];

      const templates = {
        tab:     document.getElementById('libTabTemplate'),
        catalog: document.getElementById('catalogRowTemplate'),
        option:  document.getElementById('libOptionTemplate')
      };

      const tabsEl    = document.getElementById('libTabs');
      const pickerBtn = document.getElementById('pickerBtn');
      const catalogsEl = document.getElementById('libCatalogs');

      /* ── Tabs ──────────────────────────────────────────────────
         Inserted before the + so the add button stays at the end. --- */
      function renderTabs() {
        tabsEl.querySelectorAll('.lib-tab:not(.add)').forEach(tab => tab.remove());
        const last = openIds.length === 1;

        openIds.forEach(id => {
          const library = INV.libraryById(id);
          const tab = templates.tab.content.firstElementChild.cloneNode(true);

          tab.dataset.lib = id;
          tab.classList.toggle('active', id === activeId);
          tab.querySelector('[data-tab-name]').textContent = library.name;

          const close = tab.querySelector('[data-hide]');
          close.dataset.hide = id;
          if (last) {
            close.setAttribute('aria-disabled', 'true');
            close.title = 'Keep at least one library in your view';
          } else {
            close.title = `Hide ${library.name} from your view`;
            close.setAttribute('aria-label', `Hide ${library.name} from your view`);
          }

          tabsEl.insertBefore(tab, pickerBtn);
        });
      }

      /* ── The active library ────────────────────────────────────── */
      function renderLibrary() {
        const library = INV.libraryById(activeId);
        if (!library) return;

        document.getElementById('libName').textContent = library.name;

        const settings = document.getElementById('libSettings');
        settings.title = `${library.name} settings`;

        const del = document.getElementById('libDelete');
        del.disabled = INV.LIBRARIES.length === 1;
        del.title = del.disabled
          ? 'A catalog needs at least one library'
          : `Delete ${library.name}`;

        catalogsEl.replaceChildren();
        library.catalogs.forEach(catalog => {
          const row = templates.catalog.content.firstElementChild.cloneNode(true);
          /* Dies is a single-unit catalog and has its own page. */
          row.href = catalog.name === 'Dies' ? 'catalog-dies.html' : 'catalog.html';
          row.querySelector('[data-catalog-name]').textContent = catalog.name;
          row.querySelector('[data-catalog-count]').textContent = `${catalog.items} items`;
          catalogsEl.appendChild(row);
        });
      }

      function render() {
        renderTabs();
        renderLibrary();
      }

      /* ── View list ─────────────────────────────────────────────
         Nothing is lost by hiding: the picker lists every library, so a
         hidden one is one click from coming back. ------------------- */
      function addLibrary(id) {
        if (!openIds.includes(id)) { openIds.push(id); INV.saveLibraryView(openIds.slice()); }
        activeId = id;
        render();
        renderPicker();
      }

      function hideLibrary(id) {
        if (openIds.length === 1) return;
        const index = openIds.indexOf(id);
        openIds.splice(index, 1);
        INV.saveLibraryView(openIds.slice());
        if (activeId === id) activeId = openIds[Math.min(index, openIds.length - 1)];
        render();
      }

      tabsEl.addEventListener('click', (e) => {
        const hide = e.target.closest('[data-hide]');
        if (hide) {
          e.stopPropagation();
          if (hide.getAttribute('aria-disabled') !== 'true') hideLibrary(hide.dataset.hide);
          return;
        }
        if (e.target.closest('#pickerBtn')) { openPicker(); return; }

        const tab = e.target.closest('[data-lib]');
        if (tab && tab.dataset.lib !== activeId) { activeId = tab.dataset.lib; render(); }
      });

      tabsEl.addEventListener('keydown', (e) => {
        const hide = e.target.closest('[data-hide]');
        if (!hide || (e.key !== 'Enter' && e.key !== ' ')) return;
        e.preventDefault();
        e.stopPropagation();
        if (hide.getAttribute('aria-disabled') !== 'true') hideLibrary(hide.dataset.hide);
      });

      catalogsEl.addEventListener('click', (e) => {
        const settings = e.target.closest('[data-catalog-settings]');
        if (!settings) return;
        e.preventDefault();
        window.location.href = 'catalog-settings.html';
      });

      /* ── Add a Library ─────────────────────────────────────────
         The option is a toggle, so the list is not a one-way door: what
         the row put into the view, the same row takes back out. ----- */
      const addLibFlyout = document.getElementById('addLibFlyout');
      const pickerInput  = document.getElementById('pickerInput');
      const pickerList   = document.getElementById('pickerList');
      const pickerNone   = document.getElementById('pickerNone');

      function renderPicker() {
        const query = pickerInput.value.trim().toLowerCase();
        const matches = INV.LIBRARIES.filter(l => !query || l.name.toLowerCase().includes(query));

        pickerList.replaceChildren();
        pickerNone.hidden = matches.length > 0;
        document.getElementById('pickerQuery').textContent = pickerInput.value.trim();

        /* The last library open cannot be turned off: the page always
           shows a library, and a row that removed the only one would
           leave nothing behind it. */
        const last = openIds.length === 1;

        matches.forEach(library => {
          const item = templates.option.content.firstElementChild.cloneNode(true);
          const button = item.querySelector('[data-toggle]');
          const open = openIds.includes(library.id);
          const stuck = open && last;

          button.dataset.toggle = library.id;
          button.classList.toggle('is-on', open);
          button.setAttribute('aria-pressed', open);

          item.querySelector('[data-option-name]').textContent = library.name;
          item.querySelector('[data-option-meta]').textContent =
            `${library.catalogs.length} catalog${library.catalogs.length === 1 ? '' : 's'}`;

          const mark = item.querySelector('[data-option-on]');
          mark.hidden = !open;
          if (stuck) {
            button.setAttribute('aria-disabled', 'true');
            button.title = 'Keep at least one library in your view';
            mark.querySelector('.lib-option-act').remove();
          }

          pickerList.appendChild(item);
        });
      }

      function openPicker() {
        pickerInput.value = '';
        renderPicker();
        addLibFlyout.classList.add('open');
        pickerInput.focus();
      }

      function closePicker() {
        addLibFlyout.classList.remove('open');
      }

      addLibFlyout.addEventListener('click', (e) => {
        if (e.target === addLibFlyout || e.target.closest('[data-close]')) { closePicker(); return; }
        const option = e.target.closest('[data-toggle]');
        if (option) {
          if (option.getAttribute('aria-disabled') === 'true') return;
          const id = option.dataset.toggle;
          openIds.includes(id) ? hideLibrary(id) : addLibrary(id);
          renderPicker();
          return;
        }
        /* Prototype: a real create would name the library and set who it
           belongs to before it appears as a tab. */
        if (e.target.closest('#pickerCreate')) closePicker();
      });

      pickerInput.addEventListener('input', renderPicker);

      /* Down from the field moves into the list and walks it; up walks
         back and returns to the field from the top. */
      addLibFlyout.addEventListener('keydown', (e) => {
        const options = [...pickerList.querySelectorAll('.lib-option')];

        if (e.target === pickerInput) {
          if (e.key === 'ArrowDown' && options.length) { e.preventDefault(); options[0].focus(); }
          return;
        }

        const option = e.target.closest('.lib-option');
        if (!option) return;
        const index = options.indexOf(option);

        if (e.key === 'ArrowDown') { e.preventDefault(); options[Math.min(index + 1, options.length - 1)].focus(); }
        else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (index === 0) pickerInput.focus(); else options[index - 1].focus();
        }
      });

      /* ── Library Settings ──────────────────────────────────────── */
      const libFlyout   = document.getElementById('libFlyout');
      const libNameInput = document.getElementById('libNameInput');

      document.getElementById('libSettings').addEventListener('click', () => {
        const library = INV.libraryById(activeId);
        document.getElementById('libFlyoutTitle').textContent = `${library.name} Settings`;
        libNameInput.value = library.name;
        libNameInput.classList.remove('invalid');
        libFlyout.classList.add('open');
        libNameInput.focus();
      });

      libFlyout.addEventListener('click', (e) => {
        if (e.target === libFlyout || e.target.closest('[data-close]')) {
          libFlyout.classList.remove('open');
        }
      });

      document.getElementById('libFlyoutDone').addEventListener('click', () => {
        const name = libNameInput.value.trim();
        /* A library with no name would be unfindable in the picker. */
        if (!name) {
          libNameInput.classList.add('invalid');
          libNameInput.focus();
          window.toast('Give the library a name.', 'error');
          return;
        }
        INV.libraryById(activeId).name = name;
        INV.saveLibraries();
        libFlyout.classList.remove('open');
        render();
      });

      /* ── Delete ────────────────────────────────────────────────── */
      const modal = document.getElementById('confirmModal');

      document.getElementById('libDelete').addEventListener('click', (e) => {
        if (e.currentTarget.disabled) return;
        const library = INV.libraryById(activeId);
        const count = library.catalogs.length;
        document.getElementById('confirmTitle').textContent = `Delete ${library.name}?`;
        document.getElementById('confirmBody').textContent =
          `${count} catalog${count === 1 ? '' : 's'} and everything recorded in ${count === 1 ? 'it' : 'them'} will be deleted. This cannot be undone.`;
        modal.classList.add('open');
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal || e.target.closest('[data-close-modal]')) {
          modal.classList.remove('open');
        }
      });

      document.getElementById('confirmDelete').addEventListener('click', () => {
        const index = INV.LIBRARIES.findIndex(l => l.id === activeId);
        INV.LIBRARIES.splice(index, 1);
        openIds = openIds.filter(id => id !== activeId);
        if (!openIds.length) openIds = [INV.LIBRARIES[0].id];
        INV.saveLibraryView(openIds.slice());
        activeId = openIds[0];
        modal.classList.remove('open');
        render();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (libFlyout.classList.contains('open')) { libFlyout.classList.remove('open'); return; }
        if (modal.classList.contains('open')) { modal.classList.remove('open'); return; }
        if (addLibFlyout.classList.contains('open')) { closePicker(); pickerBtn.focus(); }
      });

      render();
    </script>
  </body>
</html>
