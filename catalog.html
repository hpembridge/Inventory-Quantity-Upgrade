<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bookcloth — Items</title>
    <script src="https://kit.fontawesome.com/da08280601.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="shared/css/design-tokens.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=optional" rel="stylesheet" />
    <link rel="stylesheet" href="inventory.css" />
    <link rel="stylesheet" href="components/breadcrumbs/breadcrumbs.css" />
    <script src="inventory-data.js"></script>
    <script>
      window.SIDEBAR_CONFIG = {
        activeItem: 'Inventory',
        user: { name: 'Healey Pembridge', role: 'team member' }
      };
    </script>
  </head>
  <body>
    <script src="shared/components/sidebar-component.js"></script>

    <div class="main-content">
      <div class="breadcrumb-bar">
        <nav class="breadcrumbs">
          <a class="crumb" href="inventory.html"><i class="fa-regular fa-pallet-boxes"></i> Inventory</a>
          <i class="fa-regular fa-chevron-right crumb-sep"></i>
          <a class="crumb" href="inventory.html"><i class="fa-regular fa-layer-group"></i> Materials</a>
          <i class="fa-regular fa-chevron-right crumb-sep"></i>
          <span class="crumb current"><i class="fa-regular fa-book"></i> Bookcloth</span>
        </nav>
      </div>

      <div class="page-scroll">
        <div class="page-inner">

          <a class="back-link" href="inventory.html">
            <i class="fa-regular fa-arrow-left"></i> Back to Materials
          </a>

          <!-- Catalog name, with the page-level link alongside it -->
          <div class="title-row">
            <h5 id="catalogName"></h5>
            <a class="btn-pill outline sm" href="catalog-settings.html">
              <i class="fa-regular fa-gear"></i> Catalog Settings
            </a>
          </div>

          <!-- One tab per unit type -->
          <div class="tab-row" id="tabs"></div>

          <!-- Search acts on the whole list, so it sits on the page beside
               the tabs rather than on the table's own surface. -->
          <div class="search-panel">
            <input class="search-input" type="search" id="search"
                   placeholder="Search by item name or swatch number" autocomplete="off" />
            <div class="search-count" id="searchCount" hidden></div>
          </div>

          <div class="page-card is-flush">
            <!-- Quantity table (read-only — drill into an item to edit) -->
            <div class="table-wrap">
              <table class="data">
                <thead><tr id="headRow"></tr></thead>
                <tbody id="rows"></tbody>
              </table>
              <div class="table-empty" id="emptyState" hidden>No items found. Try a different search.</div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script>
      const INV = window.INVENTORY;
      const { ITEMS, fmt } = INV;

      const cfg      = INV.loadConfig();
      const tabsEl   = document.getElementById('tabs');
      const headEl   = document.getElementById('headRow');
      const rowsEl   = document.getElementById('rows');
      const emptyEl  = document.getElementById('emptyState');
      const countEl  = document.getElementById('searchCount');
      const searchEl = document.getElementById('search');

      let activeId = cfg.unitTypes[0]?.id || null;

      /* Tabs are views of the items table. The vendor list and catalog
         settings act on the catalog itself, so they sit up beside its
         name rather than in this row. */
      function renderTabs() {
        tabsEl.innerHTML = cfg.unitTypes.map(t =>
          `<button class="tab-btn${t.id === activeId ? ' active' : ''}" type="button" data-tab="${t.id}">${t.name}</button>`
        ).join('');
      }

      document.getElementById('catalogName').textContent = cfg.catalog;

      tabsEl.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-tab]');
        if (!btn || btn.dataset.tab === activeId) return;
        activeId = btn.dataset.tab;
        renderTabs();
        renderHead();
        render(searchEl.value);
      });

      /* Every unit type reports the same figures, so every tab shows
         the same columns — only the measure in the header changes. */
      function activeType() { return INV.unitTypeById(cfg, activeId); }

      /* ── Columns ────────────────────────────────────────────────
         Declared once: the header, the cells and the sort comparison
         all read from here, so a column can't drift between them.
         `value` is what the cell shows and what sorting compares.
         --------------------------------------------------------- */
      const COLS = [
        { key: 'swatch', label: 'Swatch', cls: 'col-swatch',
          value: (it) => it.swatch,
          cell:  (it) => `<td class="swatch">${it.swatch}</td>` },

        { key: 'name', label: 'Item Name', cls: 'left', text: true,
          value: (it) => it.name,
          cell:  (it) => `<td class="left"><a class="item-link" href="item.html">${it.name}</a></td>` },

        { key: 'onOrder', label: 'On Order', cls: 'col-num', measured: true,
          value: (it, v) => v.onOrder,
          cell:  (it, v) => `<td class="qty">${fmt(v.onOrder)}</td>` },

        { key: 'inHouse', label: 'In-House', cls: 'col-num', measured: true,
          value: (it, v) => v.inHouse,
          cell:  (it, v) => `<td class="qty">${fmt(v.inHouse)}</td>` },

        { key: 'allocated', label: 'Allocated', cls: 'col-num', measured: true,
          value: (it, v) => v.allocated,
          cell:  (it, v) => `<td class="qty">${fmt(v.allocated)}</td>` },

        { key: 'available', label: 'Available', cls: 'col-num', measured: true,
          title: 'Available stock',
          value: (it, v) => v.available,
          /* The state marks the figure, not the whole cell — a tinted cell
             would read as a column of its own. Same rule as the item
             page's rollup: warning when low, error when oversold. */
          cell:  (it, v) => {
            const flag = STATE_PILL[INV.stockState(v)];
            const value = flag
              ? `<span class="pill ${flag.cls}" title="${flag.note}">${fmt(v.available)}</span>`
              : fmt(v.available);
            return `<td class="qty strong">${value}</td>`;
          } }
      ];

      /* Stock state, styled the same way here as on the item page. */
      const STATE_PILL = {
        low:  { cls: 'pill-warn',   note: 'Running low on available stock.' },
        over: { cls: 'pill-danger', note: 'Allocated stock exceeds in-house stock.' }
      };

      /* No sort until the reader asks for one, so the table opens in the
         order the catalog is kept in. */
      let sort = { key: null, dir: 'asc' };

      function renderHead() {
        const t = activeType();
        if (!t) { headEl.innerHTML = ''; return; }
        const measure = INV.quantityUnitLabel(t);
        const suffix = measure
          ? ` <span style="font-weight:var(--font-weight-book); color:var(--border-subtle)">(${measure})</span>`
          : '';

        headEl.innerHTML = COLS.map(c => {
          const on  = sort.key === c.key;
          const dir = on ? sort.dir : null;
          /* fa-sort is the resting affordance; the arrow shows direction. */
          const icon = on
            ? (dir === 'asc' ? 'fa-sort-up' : 'fa-sort-down')
            : 'fa-sort';
          return `
            <th class="${c.cls}"${c.title ? ` title="${c.title}"` : ''}
                aria-sort="${on ? (dir === 'asc' ? 'ascending' : 'descending') : 'none'}">
              <button class="th-sort${on ? ' is-sorted' : ''}" type="button" data-sort="${c.key}">
                <span>${c.label}${c.measured ? suffix : ''}</span>
                <i class="fa-solid ${icon} sort-caret"></i>
              </button>
            </th>`;
        }).join('');
      }

      /* Blank figures sort to the bottom whichever way the column is
         pointing — an unknown is not a small number. */
      function sortRows(rows) {
        if (!sort.key) return rows;
        const col = COLS.find(c => c.key === sort.key);
        const dir = sort.dir === 'asc' ? 1 : -1;
        const blank = (x) => x === null || x === undefined || x === '';

        return rows.slice().sort((a, b) => {
          const av = col.value(a.it, a.v), bv = col.value(b.it, b.v);
          if (blank(av) && blank(bv)) return 0;
          if (blank(av)) return 1;
          if (blank(bv)) return -1;
          if (col.text) return String(av).localeCompare(String(bv), undefined, { numeric: true }) * dir;
          return (av - bv) * dir;
        });
      }

      /* ── Rows ───────────────────────────────────────────────── */
      function render(query = '') {
        const t = activeType();
        if (!t) { rowsEl.innerHTML = ''; return; }

        const q = query.trim().toLowerCase();
        const list = q
          ? ITEMS.filter(it => it.name.toLowerCase().includes(q) || String(it.swatch).includes(q))
          : ITEMS;

        /* Figures are worked out once per row, then shared by the cells
           and the comparison. */
        const rows = sortRows(list.map(it => ({ it, v: INV.itemQty(it, t) })));

        rowsEl.innerHTML = rows.map(({ it, v }) =>
          `<tr class="row-link" data-href="item.html">${
            COLS.map(c => c.cell(it, v)).join('')
          }</tr>`
        ).join('');

        emptyEl.hidden = rows.length > 0;
        /* A count only earns its place while a search is narrowing the list. */
        countEl.hidden = !q;
        countEl.textContent = q ? `Showing ${rows.length} of ${ITEMS.length} items` : '';
      }

      /* First click sorts ascending; clicking the same column flips it. */
      headEl.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-sort]');
        if (!btn) return;
        const key = btn.dataset.sort;
        sort = sort.key === key
          ? { key, dir: sort.dir === 'asc' ? 'desc' : 'asc' }
          : { key, dir: 'asc' };
        renderHead();
        render(searchEl.value);
      });

      /* The whole row opens the item. The name keeps its real link so
         middle-click, keyboard and "open in new tab" still work; this
         handler only covers clicks that land elsewhere in the row. */
      rowsEl.addEventListener('click', (e) => {
        if (e.target.closest('a')) return;
        const row = e.target.closest('.row-link');
        if (row) window.location.href = row.dataset.href;
      });

      searchEl.addEventListener('input', e => render(e.target.value));

      renderTabs();
      renderHead();
      render();
    </script>
  </body>
</html>
